<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#02060d}</style></head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const cfg = await (await fetch("/config.json")).json();
const data = await (await fetch("/models.json")).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const pm = new THREE.PMREMGenerator(renderer);
const env = pm.fromScene(new RoomEnvironment(renderer), 0.04).texture;
function bg() { const c = document.createElement("canvas"); c.width = 4; c.height = 256; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "#1b5578"); gr.addColorStop(0.6, "#0b2d4a"); gr.addColorStop(1, "#061a2e");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const BG = bg();

const MESH_SHAPE = { Sphere: "Ellipsoid", Cylinder: "MeshCylinderX", CylinderMesh: "MeshCylinderY", Head: "MeshCylinderY" };
function cfm(cf) { const m = new THREE.Matrix4(); m.set(cf[3], cf[4], cf[5], cf[0], cf[6], cf[7], cf[8], cf[1], cf[9], cf[10], cf[11], cf[2], 0, 0, 0, 1); return m; }
function oldGroup(model) {
  const g = new THREE.Group();
  const inv = cfm(model.primary).invert();
  for (const p of model.parts) {
    if ((p.transparency || 0) >= 0.95) continue;
    let shape = p.shape, size = p.size.slice(), cf = p.cf.slice();
    if (p.meshType) {
      const sc = p.meshScale || [1, 1, 1], off = p.meshOffset || [0, 0, 0];
      shape = MESH_SHAPE[p.meshType] || "Block"; size = size.map((v, i) => v * sc[i]);
      cf = [cf[0] + cf[3] * off[0] + cf[4] * off[1] + cf[5] * off[2], cf[1] + cf[6] * off[0] + cf[7] * off[1] + cf[8] * off[2], cf[2] + cf[9] * off[0] + cf[10] * off[1] + cf[11] * off[2], ...cf.slice(3)];
    } else if (shape === "Ball") { const d = Math.min(...size); size = [d, d, d]; }
    else if (shape === "Cylinder") { const d = Math.min(size[1], size[2]); size = [size[0], d, d]; }
    let geo;
    if (shape === "Ball" || shape === "Ellipsoid") geo = new THREE.SphereGeometry(0.5, 40, 28);
    else if (shape === "Cylinder" || shape === "MeshCylinderX") { geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 40); geo.rotateZ(Math.PI / 2); }
    else if (shape === "MeshCylinderY") geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 40);
    else geo = new THREE.BoxGeometry(1, 1, 1);
    const neon = p.material === "Neon", metal = p.material === "Foil" || p.material === "Metal";
    const col = new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2], THREE.SRGBColorSpace);
    const mat = new THREE.MeshStandardMaterial({ color: col, roughness: metal ? 0.3 : p.material === "Slate" ? 0.7 : 0.5, metalness: metal ? 0.85 : 0,
      emissive: neon ? col : 0x000000, emissiveIntensity: neon ? 0.55 : 0, transparent: p.transparency > 0, opacity: 1 - (p.transparency || 0) });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.applyMatrix4(new THREE.Matrix4().copy(inv).multiply(cfm(cf)).multiply(new THREE.Matrix4().makeScale(size[0], size[1], size[2])));
    g.add(mesh);
  }
  return g;
}
const loader = new GLTFLoader();
const loadGlb = (url) => new Promise((res, rej) => loader.load(url, (g) => res(g.scene), undefined, rej));

function sceneFor(obj) {
  const sc = new THREE.Scene(); sc.background = BG; sc.environment = env; sc.environmentIntensity = 0.8;
  sc.add(obj);
  const key = new THREE.DirectionalLight(0xfff2e0, 2.2); key.position.set(-3, 6, -4); sc.add(key);
  const rim = new THREE.DirectionalLight(0x7fd0ff, 1.0); rim.position.set(4, 2, 5); sc.add(rim);
  return sc;
}
const W = cfg.cellW, H = cfg.cellH;
renderer.setSize(W, H);
const out = document.createElement("canvas"); out.width = W * cfg.cols; out.height = H * cfg.names.length + 70;
const ctx = out.getContext("2d");
ctx.fillStyle = "#02060d"; ctx.fillRect(0, 0, out.width, out.height);
ctx.fillStyle = "#e8f6ff"; ctx.font = "bold 30px sans-serif"; ctx.fillText(cfg.title, 20, 44);

function cam(box, az, el, aspect) {
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const cam = new THREE.PerspectiveCamera(30, aspect, 0.05, 500);
  const d = r / Math.sin(THREE.MathUtils.degToRad(15)) * 0.62;
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  cam.position.set(c.x + d * Math.sin(a) * Math.cos(e), c.y + d * Math.sin(e), c.z - d * Math.cos(a) * Math.cos(e));
  cam.lookAt(c); return cam;
}
for (let row = 0; row < cfg.names.length; row++) {
  const name = cfg.names[row];
  const model = data.models.find((m) => m.name === name);
  const oldO = oldGroup(model);
  const newO = await loadGlb(`/meshes/${name}/${name}.glb`);
  newO.traverse((o) => { if (o.isMesh) { o.material.envMapIntensity = 1.0; } });
  const sO = sceneFor(oldO), sN = sceneFor(newO);
  const box = new THREE.Box3().setFromObject(newO).union(new THREE.Box3().setFromObject(oldO));
  for (let c = 0; c < cfg.cols; c++) {
    const v = cfg.views[Math.floor(c / 2)], isNew = c % 2 === 1;
    const camera = cam(box, v.az, v.el, W / H);
    renderer.render(isNew ? sN : sO, camera);
    ctx.drawImage(renderer.domElement, c * W, 70 + row * H);
    ctx.fillStyle = "rgba(2,6,13,0.6)"; ctx.fillRect(c * W + 8, 70 + row * H + 8, 330, 28);
    ctx.fillStyle = isNew ? "#7dffb0" : "#ffb8a0"; ctx.font = "bold 17px sans-serif";
    ctx.fillText(`${name} - ${isNew ? "NEW smooth mesh" : "OLD parts"} (${v.name})`, c * W + 14, 70 + row * H + 28);
  }
}
window.result = out.toDataURL("image/png");
window.ready = true;
</script></body></html>
